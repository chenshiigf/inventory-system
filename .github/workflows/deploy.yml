name: Inventory CI and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply reviewed database migrations after making a full backup'
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a deployment while it is changing files or migrating the DB.
concurrency:
  group: inventory-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: api/requirements.lock.txt
      - name: Install locked runtime and test dependencies
        run: python -m pip install -r api/requirements.lock.txt 'pytest>=8,<9' 'httpx>=0.27,<1'
      - name: Run backend and deployment tests
        working-directory: api
        run: python -m pytest -q
      - name: Prepare API source and prebuilt dependency wheels
        run: |
          set -euo pipefail
          mkdir -p release/api release/wheels
          git archive HEAD api/app api/alembic api/scripts api/alembic.ini api/requirements.txt api/requirements.lock.txt | tar -x -C release
          python -m pip download --only-binary=:all: -r api/requirements.lock.txt -d release/wheels
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('release/release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA']}))
          PY
          tar -czf backend.tar.gz -C release api wheels release.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend
          path: backend.tar.gz
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
      - name: Install project pnpm version
        run: npm install --global pnpm@10.34.5
      - name: Install locked frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript and ESLint
        working-directory: web
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
      - name: Build same-origin static frontend
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: ''
        run: |
          pnpm build
          test -s out/index.html
          tar -czf ../frontend.tar.gz out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend
          path: frontend.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [backend, frontend]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*end'
          merge-multiple: true
      - name: Assemble tested release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir release
          tar -xzf backend.tar.gz -C release
          tar -xzf frontend.tar.gz -C release
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${COMMIT_SHA}"
          tar -czf "$RELEASE_ID.tar.gz" -C release api wheels release.json out
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_DIGEST=$(sha256sum "$RELEASE_ID.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/inventory_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/inventory_key" "$HOME/.ssh/known_hosts"
          echo "DEPLOY_SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_USER=$SSH_USER" >> "$GITHUB_ENV"
      - name: Upload and deploy
        env:
          MIGRATE: ${{ inputs.migrate && 'true' || 'false' }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i "$HOME/.ssh/inventory_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          scp "${SSH_ARGS[@]}" -P "$DEPLOY_SSH_PORT" "$RELEASE_ID.tar.gz" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/var/tmp/inventory-actions/$RELEASE_ID.tar.gz"
          ssh "${SSH_ARGS[@]}" -p "$DEPLOY_SSH_PORT" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "sudo -n /usr/local/sbin/inventory-deploy-actions $RELEASE_ID $RELEASE_DIGEST $MIGRATE"
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/inventory_key"
